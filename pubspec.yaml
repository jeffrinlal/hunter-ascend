name: hunter_ascend
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+30

environment:
  sdk: ">=3.7.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
